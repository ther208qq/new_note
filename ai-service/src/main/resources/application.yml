spring:
  application:
    name: ai-service

  cloud:
    nacos:
      discovery:
        server-addr: 192.168.88.100:8848

  rabbitmq:
    publisher-confirm-type: correlated
    publisher-returns: true
    connection-timeout: 1s
    template:
      retry:
        enabled: true
        initial-interval: 1000ms
        multiplier: 1 #失败后的等待时长倍数，下次等待时长  initial-interval*multiplier
        max-attempts: 3 #最大重试次数
    cache:
      connection:
        mode: CONNECTION
    host: 192.168.88.100
    port: 5672
    virtual-host: /guest
    username: guest
    password: 1234

    listener:
      hello:
        prefetch: 1
      simple:
        acknowledge-mode: auto
        retry:
          enabled: true
          initial-interval: 1000ms
          max-attemps: 3
          stateless: true
  data:
    redis:
      host: 192.168.88.100
      port: 6379
      password: 1234
server:
  port: 8083